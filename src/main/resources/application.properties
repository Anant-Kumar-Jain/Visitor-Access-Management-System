# ----------------------------------------
# Database Connection Settings (Cloud Ready)
# ----------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/vams_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# Hibernate / JPA Settings
# 'update' automatically creates database tables based on our Java code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Web Server Port (Render.com uses the PORT environment variable)
server.port=${PORT:8080}

# ----------------------------------------
# Production SSL / HTTPS (Phase 7)
# ----------------------------------------
# These will be un-commented and used in Phase 7 to enable HTTPS
# so that mobile browsers will allow the scanner to use the camera.
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=yourpassword
# server.ssl.key-store-type=pkcs12
# server.ssl.key-alias=tomcat
# server.ssl.enabled=true

# Disable Thymeleaf cache for development
spring.thymeleaf.cache=false
