<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>VAMS - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="/css/style.css?v=3" rel="stylesheet">
</head>
<body class="modern-auth-container d-flex align-items-center justify-content-center">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            
            <div class="text-center mb-4">
                <h4 class="modern-auth-title mb-1">Welcome Back</h4>
                <p class="modern-auth-subtitle mb-0">Sign in to your account</p>
            </div>

            <div class="card modern-auth-card p-4">
                <div class="card-body p-0">
                    
                    <div th:if="${param.error}" class="alert alert-danger rounded-3 p-2 small text-center">
                        Invalid credentials, or email not verified.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success rounded-3 p-2 small text-center">
                        You have been logged out.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success rounded-3 p-2 small text-center">
                        Email verified. Please log in.
                    </div>
                    <div th:if="${param.passwordReset}" class="alert alert-success rounded-3 p-2 small text-center">
                        Password updated successfully.
                    </div>

                    <form th:action="@{/login}" method="post">
                        
                        <!-- Email / User ID Input -->
                        <div class="mb-3">
                            <label class="modern-auth-subtitle fw-bold mb-1 d-block" style="font-size: 0.8rem;">Email or User ID</label>
                            <div class="input-group modern-input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <!-- Password Input -->
                        <div class="mb-3">
                            <label class="modern-auth-subtitle fw-bold mb-1 d-block" style="font-size: 0.8rem;">Password</label>
                            <div class="input-group modern-input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>
                        
                        <!-- Remember Me & Forgot Password -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check mb-0">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label modern-auth-subtitle" for="rememberMe">
                                    Remember me
                                </label>
                            </div>
                            <a th:href="@{/forgot-password}" class="modern-auth-link fw-bold">Forgot Password?</a>
                        </div>
                        
                        <!-- Submit Button -->
                        <button type="submit" class="btn-primary-action w-100">Sign In</button>

                    </form>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <span class="modern-auth-subtitle">Don't have an account? </span>
                <a th:href="@{/register}" class="modern-auth-link fw-bold text-decoration-none" style="color: var(--color-primary-blue) !important;">Sign up for free</a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
