version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: vams_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
